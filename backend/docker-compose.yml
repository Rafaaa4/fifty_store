services:
  postgres:
    image: postgres:16-alpine
    container_name: fifty-store-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fifty_store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - fifty_store_pgdata:/var/lib/postgresql/data

volumes:
  fifty_store_pgdata:
